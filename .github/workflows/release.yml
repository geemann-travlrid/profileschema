name: Publish Global Traveler Profile v1.0.0
on:
  push:
    branches: [main]
    paths:
      - docs/traveler-profile/1.0.0/Global_Traveler_Profile_v1.0.0.zip
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the schema and release package
        run: |
          python -m pip install 'jsonschema[format]>=4.18,<5'
          cd docs/traveler-profile/1.0.0
          python verify.py > /tmp/results.json
          cmp validation-results.json /tmp/results.json
          unzip -p Global_Traveler_Profile_v1.0.0.zip global-traveler-profile-1.0.0.schema.json | cmp schema.json -
      - name: Publish the verified distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=traveler-profile-v1.0.0
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          gh release create "$tag" docs/traveler-profile/1.0.0/Global_Traveler_Profile_v1.0.0.zip --target "$GITHUB_SHA" --title "Global Traveler Profile v1.0.0" --notes "First public edition. See the [release notes](https://github.com/geemann-travlrid/profileschema/blob/$GITHUB_SHA/docs/release-notes.md) for documentation, the schema checksum and validation results."
